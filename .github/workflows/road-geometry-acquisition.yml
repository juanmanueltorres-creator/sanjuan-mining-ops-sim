name: Road Geometry Acquisition

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-veladero:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Acquire Veladero road sources
        run: node scripts/acquire-road-sources.mjs veladero

      - name: Upload acquisition artifact
        uses: actions/upload-artifact@v4
        with:
          name: veladero-road-sources
          path: artifacts/road-geometry-acquisition/
          if-no-files-found: error
