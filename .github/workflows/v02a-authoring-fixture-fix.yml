name: V0.2A Hualilan authoring fixture fix

on:
  push:
    paths:
      - '.github/workflows/v02a-authoring-fixture-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.2a-route-refinement
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact authoring fixture patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/author-hualilan-v2.mjs')
          text = path.read_text()

          replacements = [
              (
                  """  const dnvFirst = selected.dnv.filter((feature) => !['149'].includes(String(feature.properties?.designacion_de_red_vial ?? '')));\n  const dnvLast = selected.dnv.filter((feature) => String(feature.properties?.designacion_de_red_vial ?? '') === '149');\n  assert(dnvFirst.length > 0 && dnvLast.length > 0, 'Hualilan DNV selection must include regional and RN149 legs');\n  assertGroupContinuity([dnvFirst, selected.ign, dnvLast, selected.osm]);\n""",
                  """  const dnvRegional = selected.dnv.filter((feature) => String(feature.properties?.designacion_de_red_vial ?? '') !== '149');\n  const dnvLast = selected.dnv.filter((feature) => String(feature.properties?.designacion_de_red_vial ?? '') === '149');\n  const hasRn149 = dnvLast.length > 0;\n  const dnvFirst = hasRn149 ? dnvRegional : selected.dnv;\n  assert(dnvFirst.length > 0, 'Hualilan DNV selection must include at least one reviewed regional leg');\n  assertGroupContinuity(hasRn149\n    ? [dnvFirst, selected.ign, dnvLast, selected.osm]\n    : [dnvFirst, selected.ign, selected.osm]);\n""",
              ),
              (
                  "  const rn149End = endpoints(dnvLast).end;\n",
                  "  const rn149End = hasRn149 ? endpoints(dnvLast).end : null;\n",
              ),
              (
                  """      { id: 'rp436-rn149-junction', lat: rp436End[1], lon: rp436End[0], maxDistanceToRouteKm: 0.25, evidenceRefs: ['hualilan-ign-road-geometry-v2', 'hualilan-dnv-road-geometry-v2'] },\n      { id: 'rn149-osm-access-junction', lat: rn149End[1], lon: rn149End[0], maxDistanceToRouteKm: 0.25, evidenceRefs: ['hualilan-dnv-road-geometry-v2', 'hualilan-osm-access-geometry-v2'] },\n""",
                  """      ...(hasRn149 ? [\n        { id: 'rp436-rn149-junction', lat: rp436End[1], lon: rp436End[0], maxDistanceToRouteKm: 0.25, evidenceRefs: ['hualilan-ign-road-geometry-v2', 'hualilan-dnv-road-geometry-v2'] },\n        { id: 'rn149-osm-access-junction', lat: rn149End[1], lon: rn149End[0], maxDistanceToRouteKm: 0.25, evidenceRefs: ['hualilan-dnv-road-geometry-v2', 'hualilan-osm-access-geometry-v2'] },\n      ] : [\n        { id: 'rp436-osm-access-junction', lat: rp436End[1], lon: rp436End[0], maxDistanceToRouteKm: 0.25, evidenceRefs: ['hualilan-ign-road-geometry-v2', 'hualilan-osm-access-geometry-v2'] },\n      ]),\n""",
              ),
              (
                  "      { id: 'hualilan-rn149-public-v2', geometryClass: 'PUBLIC_ROAD', sourceDatasetId: dnvSourceId, sourceFeatureIds: ids(dnvLast), evidenceRefs: ['hualilan-dnv-road-geometry-v2'], label: 'RN 149' },\n",
                  "      ...(hasRn149 ? [{ id: 'hualilan-rn149-public-v2', geometryClass: 'PUBLIC_ROAD', sourceDatasetId: dnvSourceId, sourceFeatureIds: ids(dnvLast), evidenceRefs: ['hualilan-dnv-road-geometry-v2'], label: 'RN 149' }] : []),\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Fail closed: expected exact block once, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run focused authoring contract
        run: npx vitest --run scripts/author-hualilan-v2.test.mjs
      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name 'Juan Manuel Torres'
          git config user.email 'juan.manuel.torres@mi.unc.edu.ar'
          git add scripts/author-hualilan-v2.mjs
          git diff --cached --check
          git commit -m 'fix: keep Hualilan authoring builder fixture-safe'
          git push origin HEAD:feat/v0.2a-route-refinement
