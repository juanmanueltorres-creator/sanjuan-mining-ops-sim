name: Materialize environment snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/build-environment.mjs
      - .github/workflows/materialize-environment.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v0-foundation

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check existing snapshot
        id: snapshot
        shell: bash
        run: |
          if [ -f public/data/environment/environment-sj-20260830.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build versioned environment snapshot
        if: steps.snapshot.outputs.exists != 'true'
        run: node scripts/build-environment.mjs --target-date 2026-08-30 --out public/data/environment/environment-sj-20260830.json

      - name: Print snapshot checksum
        if: steps.snapshot.outputs.exists != 'true'
        run: sha256sum public/data/environment/environment-sj-20260830.json

      - name: Commit exact snapshot
        if: steps.snapshot.outputs.exists != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/environment/environment-sj-20260830.json
          git commit -m "data: add versioned San Juan environment snapshot"
          git push origin HEAD:feat/v0-foundation
