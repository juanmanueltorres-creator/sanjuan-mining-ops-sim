name: V0.2A Hualilan V2 build

on:
  push:
    branches:
      - feat/v0.2a-route-refinement
    paths:
      - .github/workflows/v02a-hualilan-build.yml

permissions:
  contents: read
  actions: read

jobs:
  build-hualilan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAW_ARTIFACT_ID: '9828611093'
      RAW_WORKFLOW_RUN_ID: '33581698513'
      RAW_ARTIFACT_NAME: v02a-hualilan-road-sources
      RAW_ARTIFACT_DIGEST: sha256:3989e643c89399293b9bb6fe09bfc50273bd034060df1e2924a0f652306c1bc3
      RAW_HEAD_SHA: f3d2a2f4c4d3cf344aada342bf896b5bb7d0a729
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/v0.2a-route-refinement

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download frozen raw acquisition artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/hualilan-acquisition
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RAW_ARTIFACT_ID}/zip" \
            > artifacts/hualilan-acquisition.zip
          unzip -q artifacts/hualilan-acquisition.zip -d artifacts/hualilan-acquisition
          test -s artifacts/hualilan-acquisition/dnv-national-roads.v1.geojson
          test -s artifacts/hualilan-acquisition/ign-provincial-roads.v1.geojson
          test -s artifacts/hualilan-acquisition/osm-access.v1.geojson
          test -s artifacts/hualilan-acquisition/source-inventory.json

      - name: First reproducible authoring and build
        shell: bash
        run: |
          set -euo pipefail
          node scripts/author-hualilan-v2.mjs \
            --acquisition-dir artifacts/hualilan-acquisition \
            --output-dir public/data/corridors/hualilan \
            --workflow-run-id "${RAW_WORKFLOW_RUN_ID}" \
            --artifact-id "${RAW_ARTIFACT_ID}" \
            --artifact-name "${RAW_ARTIFACT_NAME}" \
            --artifact-digest "${RAW_ARTIFACT_DIGEST}" \
            --head-sha "${RAW_HEAD_SHA}"
          npm run build:road-geometry -- hualilan
          mkdir -p artifacts/v02a-hualilan-v2-authored
          sha256sum \
            public/data/corridors/hualilan/sources.v2.json \
            public/data/corridors/hualilan/source-snapshots/dnv-national-roads.v1.geojson \
            public/data/corridors/hualilan/source-snapshots/ign-provincial-roads.v1.geojson \
            public/data/corridors/hualilan/source-snapshots/osm-access.v1.geojson \
            public/data/corridors/hualilan/metadata.v2.json \
            public/data/corridors/hualilan/corridor.v2.geojson \
            public/data/corridors/hualilan/segments.v2.geojson \
            public/data/corridors/hualilan/route-samples.v2.json \
            > artifacts/v02a-hualilan-v2-authored/sha-before.txt

      - name: Second reproducible authoring and build
        shell: bash
        run: |
          set -euo pipefail
          node scripts/author-hualilan-v2.mjs \
            --acquisition-dir artifacts/hualilan-acquisition \
            --output-dir public/data/corridors/hualilan \
            --workflow-run-id "${RAW_WORKFLOW_RUN_ID}" \
            --artifact-id "${RAW_ARTIFACT_ID}" \
            --artifact-name "${RAW_ARTIFACT_NAME}" \
            --artifact-digest "${RAW_ARTIFACT_DIGEST}" \
            --head-sha "${RAW_HEAD_SHA}"
          npm run build:road-geometry -- hualilan
          sha256sum \
            public/data/corridors/hualilan/sources.v2.json \
            public/data/corridors/hualilan/source-snapshots/dnv-national-roads.v1.geojson \
            public/data/corridors/hualilan/source-snapshots/ign-provincial-roads.v1.geojson \
            public/data/corridors/hualilan/source-snapshots/osm-access.v1.geojson \
            public/data/corridors/hualilan/metadata.v2.json \
            public/data/corridors/hualilan/corridor.v2.geojson \
            public/data/corridors/hualilan/segments.v2.geojson \
            public/data/corridors/hualilan/route-samples.v2.json \
            > artifacts/v02a-hualilan-v2-authored/sha-after.txt
          diff -u artifacts/v02a-hualilan-v2-authored/sha-before.txt artifacts/v02a-hualilan-v2-authored/sha-after.txt

      - name: Validate Hualilan V2
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:road-geometry -- hualilan | tee artifacts/v02a-hualilan-v2-authored/validation.txt
          npx vitest --run \
            scripts/author-hualilan-v2.test.mjs \
            scripts/build-road-geometry.test.mjs \
            scripts/validate-road-geometry.test.mjs

      - name: Collect authored V2 bundle
        shell: bash
        run: |
          set -euo pipefail
          cp public/data/corridors/hualilan/sources.v2.json artifacts/v02a-hualilan-v2-authored/
          cp public/data/corridors/hualilan/metadata.v2.json artifacts/v02a-hualilan-v2-authored/
          cp public/data/corridors/hualilan/corridor.v2.geojson artifacts/v02a-hualilan-v2-authored/
          cp public/data/corridors/hualilan/segments.v2.geojson artifacts/v02a-hualilan-v2-authored/
          cp public/data/corridors/hualilan/route-samples.v2.json artifacts/v02a-hualilan-v2-authored/
          mkdir -p artifacts/v02a-hualilan-v2-authored/source-snapshots
          cp public/data/corridors/hualilan/source-snapshots/dnv-national-roads.v1.geojson artifacts/v02a-hualilan-v2-authored/source-snapshots/
          cp public/data/corridors/hualilan/source-snapshots/ign-provincial-roads.v1.geojson artifacts/v02a-hualilan-v2-authored/source-snapshots/
          cp public/data/corridors/hualilan/source-snapshots/osm-access.v1.geojson artifacts/v02a-hualilan-v2-authored/source-snapshots/

      - name: Upload authored Hualilan V2 bundle
        uses: actions/upload-artifact@v4
        with:
          name: v02a-hualilan-v2-authored
          path: artifacts/v02a-hualilan-v2-authored/
          if-no-files-found: error
