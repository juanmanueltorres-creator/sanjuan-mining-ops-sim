name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test -- --run

      - name: Validate data
        run: npm run validate:data

      - name: Validate Veladero V2 geometry
        run: npm run validate:road-geometry -- veladero

      - name: Audit provenance claims
        run: npm run audit:claims

      - name: Build
        env:
          VITE_CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_PUBLIC_TOKEN }}
        run: npm run build

      - name: Visual QA
        run: npm run qa:visual

      - name: Terrain WebGL smoke
        run: npm run qa:terrain

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: artifacts/visual-qa/*.png
          if-no-files-found: ignore

      - name: Upload terrain smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-smoke
          path: artifacts/terrain-smoke/*.png
          if-no-files-found: ignore
