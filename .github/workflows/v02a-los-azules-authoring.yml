name: V0.2A Los Azules road-source authoring

on:
  push:
    branches:
      - feat/v0.2a-route-refinement
    paths:
      - .github/workflows/v02a-los-azules-authoring.yml

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Acquire Los Azules sources
        run: npm run acquire:road-sources -- los-azules

      - name: Upload authoring artifact
        uses: actions/upload-artifact@v4
        with:
          name: v02a-los-azules-road-sources
          path: artifacts/road-geometry-acquisition-los-azules/
          if-no-files-found: error
